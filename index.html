<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kristiansand Live</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: #fff;
            font-family: system-ui;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            justify-content: space-between;
            padding: 10px 20px;
            background: #000000;
        }

        h1,
        #clock {
            font-size: 1.5rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2px;
            padding: 4px;
            overflow-y: auto;
        }

        .cam {
            position: relative;
            background: #111;
            cursor: pointer;
            aspect-ratio: 16/9;
        }

        .cam span {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, .6);
            padding: 5px 10px;
            border-radius: 3px;
            font-size: .9rem;
            white-space: nowrap;
        }

        .cam video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        #modal {
            display: none;
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 100;
            flex-direction: column;
        }

        #modal.open {
            display: flex;
        }

        #modal button {
            align-self: flex-end;
            margin: 10px;
            padding: 8px 16px;
            cursor: pointer;
        }

        #modal video {
            flex: 1;
            object-fit: contain;
        }

        @media (max-width: 600px) {
            .grid {
                grid-template-columns: 1fr;
            }

            h1,
            #clock {
                font-size: 1rem;
            }

            .cam span {
                font-size: .75rem;
                padding: 3px 6px;
            }
        }
    </style>
</head>

<body>
    <header>
        <h1>Kristiansand Live</h1>
        <div id="clock"></div>
    </header>
    <div class="grid" id="grid"></div>
    <div id="modal">
        <button onclick="closeModal()">✕ Close</button>
        <video id="modalVideo" controls autoplay muted></video>
    </div>
    <script>
        const cameras = [
            { name: "Bystranda", url: "https://polarislive-lh.akamaized.net/hls/live/2039438/fvn/jqGugHSmKzQwRw5pMerRL/master.m3u8" },
            { name: "Kristiansand Havn", url: "https://polarislive-lh.akamaized.net/hls/live/2039439/fvn/yJKAuwx5vVRZR46DZsCkE/master.m3u8" },
            { name: "Lindesnes Fyr", url: "https://polarislive-lh.akamaized.net/hls/live/2039440/fvn/9wOObU20Nmtsqt8WRITUL/master.m3u8" },
            { name: "Gartnerløkka", url: "https://polarislive-lh.akamaized.net/hls/live/2039440/fvn/hzDaPl9KkIbkcZFUvWFfg/master.m3u8" },
            { name: "Varoddbrua", url: "https://polarislive-lh.akamaized.net/hls/live/2039441/fvn/LRIXC23aIKgRVowDr7yhS/master.m3u8" },
            { name: "Torvet", url: "https://polarislive-lh.akamaized.net/hls/live/2039440/fvn/jcp1YQkJV7Zb4khPH2q8O/master.m3u8" }
        ];

        let modalHls;

        function playHls(video, url) {
            if (Hls.isSupported()) {
                const hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
                return hls;
            }
            video.src = url;
            video.play();
        }

        cameras.forEach(cam => {
            const div = document.createElement('div');
            div.className = 'cam';
            div.innerHTML = `<span>${cam.name}</span><video muted playsinline></video>`;
            div.onclick = () => openModal(cam.url);
            grid.appendChild(div);
            playHls(div.querySelector('video'), cam.url);
        });

        function openModal(url) {
            if (modalHls) modalHls.destroy();
            modalHls = playHls(modalVideo, url);
            modal.classList.add('open');
        }

        function closeModal() {
            modal.classList.remove('open');
            modalVideo.pause();
            if (modalHls) { modalHls.destroy(); modalHls = null; }
        }

        setInterval(() => {
            clock.textContent = new Date().toLocaleTimeString('no-NO', { timeZone: 'Europe/Oslo' }) + ' CET';
        }, 1000);
    </script>
</body>

</html>
